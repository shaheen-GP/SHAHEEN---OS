image: node:22-bookworm

stages:
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build_shaheen_os:
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_BRANCH'
