name: SHAHEEN-OS Cloudflare Deployment

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "اسم نسخة SHAHEEN-OS على Cloudflare"
        required: true
        default: "shaheen-os"
        type: string

permissions:
  contents: read

concurrency:
  group: shaheen-os-cloudflare-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision Cloudflare resources and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTANCE_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          bash scripts/provision-cf.sh "$INSTANCE_SLUG"
